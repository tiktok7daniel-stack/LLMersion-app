plugins {
    id 'com.android.application'
}

android {
    namespace 'app.lumenread'
    compileSdk 34

    defaultConfig {
        applicationId 'app.lumenread'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// no third-party dependencies: the app is a thin native shell around android.webkit.WebView
