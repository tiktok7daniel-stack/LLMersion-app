name: Android APK

on:
  push:
    paths: ["android/**", "web/brand/**", ".github/workflows/android.yml"]
  workflow_dispatch:

# a newer push cancels an older build, so the release always holds the newest APK
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write          # to publish the APK as a GitHub release asset

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      # GitHub's Ubuntu runners already ship the Android SDK ($ANDROID_HOME);
      # only make sure the platform and build tools this project targets are there.
      - name: Android SDK packages
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk LumenRead-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LumenRead-debug-apk
          path: LumenRead-debug.apk

      # a release asset can be downloaded on a phone without logging in or unzipping
      - name: Publish to the "apk-latest" release
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-latest LumenRead-debug.apk \
            --target "${GITHUB_SHA}" --prerelease \
            --title "LumenRead APK (latest build)" \
            --notes "LumenRead for Android, built from ${GITHUB_SHA::7}. A standalone app: reading aloud, Arabic translation, PDF import, dictionary, flashcards and pronunciation practice all run on the phone. Install on Android 7+ (allow installing from unknown sources). The first translation downloads a ~30 MB language model once."
