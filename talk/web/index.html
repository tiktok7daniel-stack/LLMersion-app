<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LumenRead · Talk</title>
<link rel="icon" href="/brand/favicon.ico">
<!-- the same bundled fonts as the reader: no network request -->
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  html, body { height: 100%; margin: 0; background: #F8FAFC; }
  @media (prefers-color-scheme: dark) { html, body { background: #0B1220; } }
  #shell { display: flex; flex-direction: column; height: 100%; }
  #pop {
    flex: none; display: flex; align-items: center; gap: 10px;
    padding: 6px 10px; font: 12px/1.4 "Inter", "Cairo", system-ui, sans-serif;
    color: #475569;
  }
  #pop button {
    font: inherit; padding: 3px 10px; border-radius: 6px; cursor: pointer;
    border: 1px solid #E2E8F0; background: #FFFFFF; color: #0F172A;
  }
  #pop button:hover { background: #F1F5F9; }
  @media (prefers-color-scheme: dark) {
    #pop { color: #A9B6C9; }
    #pop button { background: #111B2E; color: #E2E8F0; border-color: #243248; }
  }
  #mount { flex: 1; min-height: 0; }
</style>
</head>
<body>
<div id="shell">
  <div id="pop">
    <button id="popBtn" type="button"></button>
    <span id="popNote"></span>
  </div>
  <div id="mount"></div>
</div>

<script src="/talk/panel.js"></script>
<script>
  (async () => {
    const floating = new URLSearchParams(location.search).has("float");
    if (floating) document.getElementById("pop").remove();

    // standalone: the panel loads /i18n/<lang>.json itself (?lang=ar forces Arabic)
    const panel = mountTalkPanel({ host: document.getElementById("mount"), flat: true });
    await panel.i18n.ready;
    document.documentElement.lang = panel.i18n.lang;
    document.documentElement.dir = panel.i18n.dir;

    const btn = document.getElementById("popBtn");
    if (btn) {
      btn.textContent = panel.i18n.t("talk.popout");
      document.getElementById("popNote").textContent = panel.i18n.t("talk.popout_note");
      btn.onclick = () => {
        window.open(location.pathname + "?float=1" + location.search.replace("?", "&"), "lumenread-talk",
                    "width=800,height=640,menubar=no,toolbar=no,location=no,status=no");
      };
    }
  })();
</script>
</body>
</html>
